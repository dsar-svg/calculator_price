<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="description" content="Calcula precios de COP a VES con tasa x4 y a EUR/USD con tasa BCV oficial">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Calculadora de Precios</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Calculadora de Precios</h1>
      <p class="subtitle">COP → VES → EUR / USD</p>
      <button class="theme-toggle" id="themeToggle" aria-label="Cambiar tema">🌞</button>
    </header>

    <section class="input-section">
      <label for="copInput">Pesos Colombianos (COP)</label>
      <div class="input-group">
        <span class="currency-symbol">$</span>
        <input type="number" id="copInput" placeholder="0" step="1" min="0" autofocus inputmode="numeric">
      </div>
    </section>

    <section class="rate-section">
      <div class="rate-info">
        <span class="rate-label">Tasa BCV</span>
        <button class="refresh-btn" id="refreshRate" aria-label="Actualizar tasa">↻</button>
      </div>
      <div class="rate-cards">
        <div class="rate-card">
          <span class="rate-currency">EUR</span>
          <span class="rate-value" id="eurRate">—</span>
          <span class="rate-unit">VES</span>
        </div>
        <div class="rate-card">
          <span class="rate-currency">USD</span>
          <span class="rate-value" id="usdRate">—</span>
          <span class="rate-unit">VES</span>
        </div>
      </div>
      <div class="rate-manual">
        <button class="manual-toggle" id="manualToggle">Ingresar tasa manualmente</button>
        <div class="manual-inputs" id="manualInputs" hidden>
          <input type="number" id="manualEur" placeholder="EUR (VES)" step="0.01" inputmode="decimal">
          <input type="number" id="manualUsd" placeholder="USD (VES)" step="0.01" inputmode="decimal">
          <button class="btn-small" id="applyManual">Aplicar</button>
        </div>
      </div>
      <p class="rate-date" id="rateDate">Cargando tasa BCV...</p>
    </section>

    <section class="results" id="results" hidden>
      <div class="result-card" data-currency="ves">
        <div class="result-header">
          <span class="result-flag">🇻🇪</span>
          <span class="result-label">Bolívares (VES)</span>
        </div>
        <div class="result-value" id="vesResult">0,00</div>
      </div>
      <div class="result-card" data-currency="eur">
        <div class="result-header">
          <span class="result-flag">🇪🇺</span>
          <span class="result-label">Euros (EUR)</span>
        </div>
        <div class="result-value" id="eurResult">0,00</div>
      </div>
      <div class="result-card" data-currency="usd">
        <div class="result-header">
          <span class="result-flag">🇺🇸</span>
          <span class="result-label">Dólares (USD)</span>
        </div>
        <div class="result-value" id="usdResult">0,00</div>
      </div>
    </section>

    <footer class="footer">
      <p>Tasa COP→VES: ÷4 · Tasa BCV automática</p>
    </footer>
  </div>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
